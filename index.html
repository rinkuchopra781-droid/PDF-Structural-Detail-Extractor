<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Structural Detail Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- Polyfill process.env -->
    <script>
      // This allows the code to run without crashing on accessing process.env
      // In a real deployment, the build system replaces process.env.API_KEY.
      // For this single file to work, one must edit the API_KEY below or inject it.
      window.process = {
        env: {
          API_KEY: "" // TODO: User must replace this or inject it via environment
        }
      };
    </script>

    <style>
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #1e293b; }
      ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #64748b; }
      .animate-fade-in { animation: fadeIn 0.5s ease-out; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-200">
    <div id="root"></div>

    <!-- 1. Load SDK as a Module and attach to Window -->
    <!-- Using esm.run (jsdelivr) which is often more reliable for direct browser usage -->
    <script type="module">
      import { GoogleGenAI, Type } from "https://esm.run/@google/genai";
      window.GoogleGenAI = GoogleGenAI;
      window.GenAIType = Type;
      window.isGenAILoaded = true;
      console.log("GenAI SDK Loaded successfully");
    </script>

    <!-- 2. Run React App -->
    <script type="text/babel">
      const { useState, useCallback, useRef, useMemo, useEffect } = React;
      const { createRoot } = ReactDOM;

      // --- Icons ---
      const Icons = {
        FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>,
        UploadCloud: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>,
        X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
        FileDown: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>,
        Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
        AlertTriangle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      };

      // --- Service ---
      const getGenAI = () => {
        // Check if global SDK is loaded
        if (!window.GoogleGenAI) {
            throw new Error("Google GenAI SDK is not loaded yet. Check your connection.");
        }
        
        const apiKey = process.env.API_KEY;
        if (!apiKey) {
             // We will handle this in the UI, but here we just return null or throw
             return null;
        }
        return new window.GoogleGenAI({ apiKey: apiKey });
      };

      const extractDetailsFromText = async (text) => {
        const ai = getGenAI();
        if (!ai) throw new Error("API Key not configured.");

        const Type = window.GenAIType; 
        // Fallback if Type is undefined (rare race condition)
        if (!Type) throw new Error("SDK Types not loaded.");

        const responseSchema = {
            type: Type.ARRAY,
            items: {
              type: Type.OBJECT,
              properties: {
                Chainage: { type: Type.STRING, description: "Chainage identifier e.g. 0+194" },
                Type: { type: Type.STRING, description: "Structure type e.g. VUP, CULVERT" },
                Material: { type: Type.STRING, description: "Material e.g. PSC GIRDER, RCC Box" },
                Size: { type: Type.STRING, description: "Dimensions e.g. 1x20.0x5.5" },
              },
              required: ["Chainage", "Type", "Material", "Size"],
            },
        };

        try {
          const prompt = `
            Extract Chainage, Type, Material, and Size from the text below. 
            Return ONLY a valid JSON array based on the schema.
            Text: ${text}
          `;
          
          const response = await ai.models.generateContent({
              model: "gemini-2.5-flash",
              contents: prompt,
              config: {
                  responseMimeType: "application/json",
                  responseSchema: responseSchema,
                  temperature: 0.1,
              },
          });

          let jsonString = response.text.trim();
          // Clean markdown if present
          const markdownMatch = jsonString.match(/```(json)?\s*([\s\S]*?)\s*```/);
          if (markdownMatch && markdownMatch[2]) jsonString = markdownMatch[2];
          
          return JSON.parse(jsonString);
        } catch (error) {
          console.error("Gemini API Error:", error);
          throw error;
        }
      };

      // --- Components ---
      const Loader = ({ small = false }) => {
        const sizeClasses = small ? 'h-5 w-5 border-2' : 'h-12 w-12 border-4';
        return (
          <div className="flex justify-center items-center py-4">
            <div className={`${sizeClasses} border-cyan-400 border-t-transparent rounded-full animate-spin`}></div>
          </div>
        );
      };

      const ProgressBar = ({ progress }) => (
        <div className="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden">
          <div className="bg-cyan-400 h-2.5 rounded-full transition-all duration-500 ease-out shadow-[0_0_10px_rgba(34,211,238,0.5)]" style={{ width: `${Math.min(Math.max(progress, 0), 100)}%` }}></div>
        </div>
      );

      const FileUpload = ({ onFileSelect, fileInputRef }) => {
        const [isDragging, setIsDragging] = useState(false);
        const handleDrop = useCallback((e) => {
          e.preventDefault(); e.stopPropagation(); setIsDragging(false);
          if (e.dataTransfer.files?.length > 0) onFileSelect(e.dataTransfer.files[0]);
        }, [onFileSelect]);

        return (
          <div
            onDragEnter={(e) => { e.preventDefault(); setIsDragging(true); }}
            onDragLeave={(e) => { e.preventDefault(); setIsDragging(false); }}
            onDragOver={(e) => e.preventDefault()}
            onDrop={handleDrop}
            className={`border-2 border-dashed ${isDragging ? 'border-cyan-400 bg-slate-700/50' : 'border-slate-600'} rounded-xl p-8 text-center transition-all duration-300 cursor-pointer hover:border-slate-500 group`}
            onClick={() => fileInputRef.current?.click()}
          >
            <input type="file" ref={fileInputRef} onChange={(e) => e.target.files?.[0] && onFileSelect(e.target.files[0])} className="hidden" accept=".pdf" />
            <div className="flex flex-col items-center justify-center space-y-4">
              <div className="bg-slate-700 p-4 rounded-full group-hover:bg-slate-600 transition-colors"><div className="text-cyan-400"><Icons.UploadCloud /></div></div>
              <div className="space-y-1">
                <p className="text-lg font-medium text-slate-200">
                  <span className="text-cyan-400">Click to upload</span> or drag PDF
                </p>
                <p className="text-sm text-slate-400">Supports PDF documents</p>
              </div>
            </div>
          </div>
        );
      };

      const Tag = ({ text }) => {
          if (!text || text === 'N/A') return <span className="text-slate-500">-</span>;
          const lower = text.toLowerCase();
          let color = 'bg-slate-700 text-slate-400 border-slate-600';
          if (lower.includes('culvert')) color = 'bg-blue-900/50 text-blue-300 border-blue-700/50';
          else if (lower.includes('girder')) color = 'bg-purple-900/50 text-purple-300 border-purple-700/50';
          else if (lower.includes('bridge')) color = 'bg-emerald-900/50 text-emerald-300 border-emerald-700/50';
          else if (lower.includes('box')) color = 'bg-sky-900/50 text-sky-300 border-sky-700/50';
          else if (lower.includes('vup') || lower.includes('lvup')) color = 'bg-amber-900/50 text-amber-300 border-amber-700/50';
          
          return <span className={`px-2.5 py-0.5 text-xs font-medium rounded-full whitespace-nowrap border ${color}`}>{text}</span>;
      };

      const ResultsTable = ({ data }) => {
        if (!data.length) return <div className="text-center py-10 px-4 bg-slate-800 rounded-lg border border-slate-700"><h3 className="text-xl font-semibold text-slate-300">No Structural Details Found</h3><p className="text-slate-400 mt-2">Try scanning a different document.</p></div>;
        return (
          <div className="overflow-x-auto bg-slate-800/70 rounded-xl shadow-lg border border-slate-700 animate-fade-in">
            <table className="w-full text-sm text-left text-slate-300">
              <thead className="text-xs text-cyan-300 uppercase bg-slate-700/50 sticky top-0">
                <tr>
                  <th className="px-6 py-4 rounded-tl-xl">S. No.</th>
                  <th className="px-6 py-4">Chainage</th>
                  <th className="px-6 py-4">Type</th>
                  <th className="px-6 py-4">Material</th>
                  <th className="px-6 py-4 rounded-tr-xl">Size</th>
                </tr>
              </thead>
              <tbody>
                {data.map((item, i) => (
                  <tr key={i} className="border-b border-slate-700 hover:bg-slate-700/30 transition-colors">
                    <td className="px-6 py-4 text-slate-400">{i + 1}</td>
                    <td className="px-6 py-4 font-mono text-white font-medium">{item.Chainage}</td>
                    <td className="px-6 py-4"><Tag text={item.Type} /></td>
                    <td className="px-6 py-4"><Tag text={item.Material} /></td>
                    <td className="px-6 py-4 font-mono">{item.Size}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      };

      const App = () => {
        const [file, setFile] = useState(null);
        const [isLoading, setIsLoading] = useState(false);
        const [error, setError] = useState(null);
        const [results, setResults] = useState(null);
        const [progress, setProgress] = useState(0);
        const [statusMessage, setStatusMessage] = useState('');
        const [searchTerm, setSearchTerm] = useState('');
        const [sdkReady, setSdkReady] = useState(false);
        const fileInputRef = useRef(null);

        useEffect(() => {
            // Check if SDK is loaded periodically
            const checkSdk = setInterval(() => {
                if (window.GoogleGenAI && window.GenAIType) {
                    setSdkReady(true);
                    clearInterval(checkSdk);
                }
            }, 500);
            return () => clearInterval(checkSdk);
        }, []);

        const handleReset = () => {
          setFile(null); setResults(null); setError(null); setProgress(0); setStatusMessage('');
          if(fileInputRef.current) fileInputRef.current.value = "";
        };

        const processPdf = async () => {
          if (!file) return;
          
          if (!process.env.API_KEY) { 
              setError("API Key is missing. Please edit the HTML file to add your API_KEY in the process.env object."); 
              return; 
          }
          
          setIsLoading(true); setError(null); setProgress(0);
          
          try {
            setStatusMessage('Reading PDF document...');
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = '';
            
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const textContent = await page.getTextContent();
              fullText += textContent.items.map(item => item.str).join(' ') + '\n';
              setProgress(Math.round((i / pdf.numPages) * 50));
            }

            if (!fullText.trim()) throw new Error("Unable to extract text. The PDF might be a scanned image.");

            setStatusMessage('Analyzing with Gemini AI...');
            // Simulate progress while waiting for API
            const interval = setInterval(() => setProgress(p => {
                if (p >= 90) return 90;
                return p + 5; 
            }), 800);
            
            const data = await extractDetailsFromText(fullText);
            clearInterval(interval);
            
            if (data) {
               // Deduplicate based on Chainage
               const unique = Array.from(new Map(data.map(item => [item.Chainage, item])).values());
               // Sort by Chainage
               unique.sort((a, b) => {
                   // Simple numeric extraction for sorting "100+200" vs "100+300"
                   const valA = parseFloat(a.Chainage.replace(/[^0-9.]/g, '')) || 0;
                   const valB = parseFloat(b.Chainage.replace(/[^0-9.]/g, '')) || 0;
                   return valA - valB;
               });
               setResults(unique);
            } else {
               setResults([]);
            }
            setProgress(100);
          } catch (err) {
            console.error(err);
            setError(err.message || "Processing failed. Please try again.");
          } finally {
            setIsLoading(false);
          }
        };

        const filtered = useMemo(() => results ? results.filter(item => JSON.stringify(item).toLowerCase().includes(searchTerm.toLowerCase())) : [], [results, searchTerm]);
        
        const downloadCsv = () => {
            if (!results) return;
            const csv = "S.No,Chainage,Type,Material,Size\n" + results.map((r, i) => `${i+1},"${r.Chainage}","${r.Type}","${r.Material}","${r.Size}"`).join("\n");
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            a.download = 'structural_details.csv';
            a.click();
        };

        return (
          <div className="min-h-screen bg-slate-900 p-4 md:p-8 font-sans text-slate-200">
            <div className="max-w-6xl mx-auto">
              <div className="text-center mb-10 animate-fade-in">
                  <h1 className="text-3xl md:text-5xl font-bold text-white mb-2 tracking-tight">
                    PDF Structural <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Extractor</span>
                  </h1>
                  <p className="text-slate-400">AI-powered extraction for engineering drawings & reports</p>
              </div>

              <main className="bg-slate-800/50 backdrop-blur-sm rounded-2xl border border-slate-700/50 p-6 md:p-8 shadow-2xl animate-fade-in">
                {!file ? (
                  <div className="max-w-2xl mx-auto">
                    <FileUpload onFileSelect={setFile} fileInputRef={fileInputRef}/>
                    {!sdkReady && (
                        <div className="mt-4 text-center text-amber-400 text-sm bg-amber-900/20 p-2 rounded border border-amber-800/50 flex items-center justify-center gap-2">
                            <div className="h-2 w-2 bg-amber-400 rounded-full animate-ping"></div>
                            Initializing AI SDK...
                        </div>
                    )}
                  </div>
                ) : (
                  <div className="space-y-6">
                    {/* File Header */}
                    <div className="flex flex-col md:flex-row items-center justify-between bg-slate-700/30 p-4 rounded-xl border border-slate-600/50 gap-4">
                      <div className="flex items-center gap-3 overflow-hidden">
                        <div className="p-2 bg-slate-700 rounded-lg text-cyan-400"><Icons.FileText /></div>
                        <div>
                            <p className="font-medium text-white truncate max-w-[200px] md:max-w-md">{file.name}</p>
                            <p className="text-xs text-slate-400">{(file.size / 1024 / 1024).toFixed(2)} MB</p>
                        </div>
                      </div>
                      <div className="flex items-center gap-3">
                         <button onClick={handleReset} className="p-2 hover:bg-slate-600 rounded-lg text-slate-400 hover:text-white transition-colors"><Icons.X /></button>
                         {!results && (
                             <button 
                                onClick={processPdf} 
                                disabled={isLoading || !sdkReady} 
                                className="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 disabled:from-slate-600 disabled:to-slate-600 disabled:cursor-not-allowed text-white font-bold py-2 px-6 rounded-lg transition-all shadow-lg shadow-cyan-900/20 flex items-center gap-2"
                             >
                                {isLoading ? <span className="flex items-center gap-2"><div className="h-4 w-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Processing...</span> : "Extract Details"}
                             </button>
                         )}
                      </div>
                    </div>

                    {/* Error Display */}
                    {error && (
                        <div className="bg-red-900/20 border border-red-500/50 text-red-200 px-4 py-4 rounded-xl flex items-start gap-3 animate-fade-in">
                            <div className="text-red-400 mt-0.5"><Icons.AlertTriangle /></div>
                            <div>
                                <p className="font-semibold">Extraction Failed</p>
                                <p className="text-sm opacity-90">{error}</p>
                            </div>
                        </div>
                    )}

                    {/* Loading State */}
                    {isLoading && (
                        <div className="py-12 px-4 text-center space-y-4 animate-fade-in">
                            <Loader />
                            <div className="max-w-md mx-auto space-y-2">
                                <p className="text-slate-300 font-medium">{statusMessage}</p>
                                <ProgressBar progress={progress} />
                                <p className="text-xs text-slate-500 text-right">{progress}%</p>
                            </div>
                        </div>
                    )}

                    {/* Results Area */}
                    {results && !isLoading && (
                      <div className="space-y-6 animate-fade-in">
                        <div className="flex flex-col sm:flex-row justify-between gap-4">
                           <div className="relative flex-1">
                             <div className="absolute left-3 top-2.5 text-slate-400"><Icons.Search /></div>
                             <input type="text" placeholder="Search chainage, type..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full bg-slate-900/50 border border-slate-600 rounded-lg py-2 pl-10 text-slate-200 focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 outline-none transition-all placeholder:text-slate-600" />
                           </div>
                           <button onClick={downloadCsv} className="bg-slate-700 hover:bg-slate-600 text-cyan-300 border border-slate-600 px-4 py-2 rounded-lg flex items-center gap-2 justify-center transition-colors font-medium shadow-sm">
                               <Icons.FileDown /> <span>Export CSV</span>
                           </button>
                        </div>
                        <ResultsTable data={filtered} />
                      </div>
                    )}
                  </div>
                )}
              </main>
              
              <footer className="mt-12 text-center text-slate-500 text-sm">
                  <p>Powered by Google Gemini 2.5 Flash & PDF.js</p>
              </footer>
            </div>
          </div>
        );
      };

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
